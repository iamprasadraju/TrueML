[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trueml"
version = "0.0.2"
description = "Machine learning without hidden abstractions."
readme = "readme.md"
license = { text = "MIT" }
requires-python = ">=3.11"

authors = [
    { name = "Prasad Raju G", email = "gls.prasadraju@gmail.com" }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "numpy",
    "networkx",
]

[project.urls]
Homepage = "https://github.com/iamprasadraju/trueml"
Repository = "https://github.com/iamprasadraju/trueml"
Documentation = "https://iamprasadraju.github.io/trueml/"
Issues = "https://github.com/iamprasadraju/trueml/issues"

[dependency-groups]
dev = [
    # "pyrefly",
    "ruff",
    "pytest",
    "prek",
]

docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.setuptools.packages.find]
where = ["."]

# [tool.pyrefly]
# preset = "default"
# search-path = ["."]

[tool.ruff]
include = ["*.py"]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"trueml/viz/cgraph.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"