[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trueml"
version = "0.0.2"
description = "Machine learning without hidden abstractions."
readme = "readme.md"
license = { text = "MIT" }
requires-python = ">=3.11"

authors = [
    { name = "Prasad Raju G", email = "gls.prasadraju@gmail.com" }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "numpy",
]

[project.urls]
Homepage = "https://github.com/iamprasadraju/trueml"
Repository = "https://github.com/iamprasadraju/trueml"
Documentation = "https://iamprasadraju.github.io/trueml/"
Issues = "https://github.com/iamprasadraju/trueml/issues"

[dependency-groups]
dev = [
    # "pyrefly",
    "ruff",
    "pytest",
    "prek",
]

[tool.setuptools.packages.find]
where = ["."]

# [tool.pyrefly]
# preset = "default"
# search-path = ["."]

[tool.ruff]
preview = true
include = ["trueml/**/*.py", "tests/**/*.py"]
target-version = "py311"
line-length = 150
indent-width = 2
exclude = [
  ".git/",
]

[tool.ruff.lint]
select = [
    "E4",   # Import-related errors
    "E7",   # Statement errors
    "E9",   # Runtime and syntax-related errors
    "F",    # Pyflakes: undefined names, unused imports
    "I",    # Import sorting
    "UP",   # Modern Python syntax
    "B",    # Likely bugs
    "SIM",  # Simplifications
    "RUF",  # Ruff-specific checks
    "F401", # remove used imports
]
ignore = [
    "E701", # Allow one-line statements: if x: return
    "E702", # Allow semicolon-separated statements
    "E501", # Allow long lines
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"