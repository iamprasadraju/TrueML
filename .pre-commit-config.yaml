repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
        stages: [pre-commit]

      # - id: pyrefly
      #   name: pyrefly check
      #   entry: uv run --no-sync pyrefly check
      #   language: system
      #   types: [python]
      #   stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: uv run --no-sync pytest
        language: system
        pass_filenames: false
        stages: [pre-push]