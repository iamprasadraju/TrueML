# .pre-commit-config.yaml using local uv execution
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: pytest
        name: pytest
        entry: uv run --no-sync pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
